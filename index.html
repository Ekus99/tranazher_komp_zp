<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажер: компенсация за задержку выплат</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d5d9e2;--ac:#0f7b6c;--ok:#12805c;--okb:#e3f6ee;--er:#b42318;--erb:#fdeceb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--tx:#e8ebf1;--mut:#9aa3b2;--bd:#343b48;--ac:#4cc9b0;--ok:#5fd3a5;--okb:#12352a;--er:#ff8f85;--erb:#3b1b19}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--tx:#e8ebf1;--mut:#9aa3b2;--bd:#343b48;--ac:#4cc9b0;--ok:#5fd3a5;--okb:#12352a;--er:#ff8f85;--erb:#3b1b19}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:8px 16px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab.on,:root:not([data-theme="light"]) .pri{color:#06201b}}
:root[data-theme="dark"] .tab.on,:root[data-theme="dark"] .pri{color:#06201b}
.tab .chk{margin-left:6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
.task{font-size:17px}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:15px}
.hint{font-weight:400;color:var(--mut);font-size:13px}
input{width:100%;box-sizing:border-box;padding:10px 12px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px}
input:focus{outline:2px solid var(--ac);border-color:transparent}
input.ok{border-color:var(--ok);background:var(--okb)}
input.bad{border-color:var(--er);background:var(--erb)}
.fb{font-size:13px;margin-top:4px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--er)}
.row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:1px solid var(--ac);cursor:pointer}
.pri{background:var(--ac);color:#fff}
.sec{background:transparent;color:var(--ac)}
.sol{display:none}
.score{font-weight:700;margin-bottom:10px}
.sol .f{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:6px 10px;border-radius:6px;margin:4px 0 10px;overflow-x:auto;white-space:nowrap}
.sol p{margin:6px 0}
.pane{display:none}.pane.on{display:block}
</style>
</head>
<body>
<main>
<h1>Тренажер: компенсация за задержку выплат</h1>
<div class="sub">Ст. 236 ТК РФ: 1/150 ключевой ставки за каждый день задержки. Ставки: до 26 июля 2026 — 14,25%, с 27 июля — 14%</div>
<div class="tabs" id="tabs"></div>
<div id="panes"></div>
</main>

<script>
function nums(s){
  s = s.replace(/(\d{1,2})\.(0[1-9]|1[0-2])(?:\.\d{2,4})?/g, '$1 ');
  return (s.match(/\d+(?:[.,]\d+)?/g) || []).map(x => String(parseFloat(x.replace(',', '.'))));
}
function num(s){
  const m = s.replace(/\s|\u00a0/g,'').replace(',', '.').match(/-?\d+(?:\.\d+)?/);
  return m ? parseFloat(m[0]) : NaN;
}
const P = (need, hint, forbid=[]) => ({type:'p', hint,
  test: v => { const n = nums(v); return need.every(x => n.includes(x)) && !forbid.some(x => n.includes(x)); }});
const N = (val, hint) => ({type:'n', hint, test: v => Math.abs(num(v) - val) < 0.011});

const TASKS = [
{
  title: 'Задача 1',
  text: 'Работнику должны были выплатить зарплату в размере <b>76 000 руб.</b> <b>23 июля 2026 года</b>, но перечислили ее <b>31 июля</b>. Рассчитайте минимальную компенсацию за задержку с учетом изменения ключевой ставки.',
  fields: [
    {label:'Период 1', sub:'даты и ставка. Например, с 3 по 9 мая, 14,50%', ...P(['24','26','14.25'], 'Ожидается: с 24 по 26 июля, ставка 14,25%')},
    {label:'Период 2', sub:'даты и ставка', ...P(['27','31','14'], 'Ожидается: с 27 по 31 июля, ставка 14%', ['14.25'])},
    {label:'Компенсация за период 1, руб.', ...N(216.6, 'Верно: 76 000 × 14,25% × 1/150 × 3 = 216,60')},
    {label:'Компенсация за период 2, руб.', ...N(354.67, 'Верно: 76 000 × 14% × 1/150 × 5 = 354,67')},
    {label:'Итого компенсация, руб.', ...N(571.27, 'Верно: 216,60 + 354,67 = 571,27')}
  ],
  sol: `<p><b>Просрочка:</b> с 24 по 31 июля включительно — 8 календарных дней.</p>
<p>С 24 по 26 июля — 3 дня по ставке 14,25%:</p><div class="f">76 000 × 14,25% × 1/150 × 3 = 216,60 руб.</div>
<p>С 27 по 31 июля — 5 дней по ставке 14%:</p><div class="f">76 000 × 14% × 1/150 × 5 = 354,67 руб.</div>
<p><b>Итого:</b></p><div class="f">216,60 + 354,67 = 571,27 руб.</div>`
},
{
  title: 'Задача 2',
  text: 'Отпускные в размере <b>45 000 руб.</b> должны были перечислить <b>29 июля 2026 года</b>, однако сотрудник получил их <b>5 августа</b>. Определите минимальную компенсацию за весь период просрочки.',
  fields: [
    {label:'Период просрочки и ставка', sub:'даты и ставка. Например, с 3 по 9 мая, 14,50%', ...P(['30','5','14'], 'Ожидается: с 30 июля по 5 августа, ставка 14% на весь период', ['14.25'])},
    {label:'Компенсация, руб.', ...N(294, 'Верно: 45 000 × 14% × 1/150 × 7 = 294,00')}
  ],
  sol: `<p><b>Просрочка:</b> с 30 июля по 5 августа включительно — 7 календарных дней.</p>
<p>Весь период действует ставка 14%.</p>
<p><b>Расчёт:</b></p><div class="f">45 000 × 14% × 1/150 × 7 = 294,00 руб.</div>`
},
{
  title: 'Задача 3',
  text: 'Работодатель задержал выплату в размере <b>200 000 руб.</b>: установленный срок — <b>30 июня 2026 года</b>, фактическая выплата — <b>30 июля</b>. Рассчитайте компенсацию отдельно по ставке 14,25% и по ставке 14%, затем определите общую сумму.',
  fields: [
    {label:'Период по ставке 14,25%', sub:'даты. Например, с 3 по 9 мая', ...P(['1','26'], 'Ожидается: с 1 по 26 июля')},
    {label:'Период по ставке 14%', sub:'даты', ...P(['27','30'], 'Ожидается: с 27 по 30 июля')},
    {label:'Компенсация по ставке 14,25%, руб.', ...N(4940, 'Верно: 200 000 × 14,25% × 1/150 × 26 = 4 940,00')},
    {label:'Компенсация по ставке 14%, руб.', ...N(746.67, 'Верно: 200 000 × 14% × 1/150 × 4 = 746,67')},
    {label:'Общая сумма компенсации, руб.', ...N(5686.67, 'Верно: 4 940,00 + 746,67 = 5 686,67')}
  ],
  sol: `<p><b>Просрочка:</b> с 1 июля по 30 июля включительно — 30 календарных дней.</p>
<p>С 1 по 26 июля — 26 дней, ставка 14,25%:</p><div class="f">200 000 × 14,25% × 1/150 × 26 = 4 940,00 руб.</div>
<p>С 27 по 30 июля — 4 дня, ставка 14%:</p><div class="f">200 000 × 14% × 1/150 × 4 = 746,67 руб.</div>
<p><b>Общая сумма:</b></p><div class="f">4 940,00 + 746,67 = 5 686,67 руб.</div>`
}
];

const tabsEl = document.getElementById('tabs'), panesEl = document.getElementById('panes');
const tabBtns = [], panes = [];
function show(i){
  tabBtns.forEach((b,k) => b.classList.toggle('on', k === i));
  panes.forEach((p,k) => p.classList.toggle('on', k === i));
  window.scrollTo({top:0});
}
TASKS.forEach((t, ti) => {
  const tb = document.createElement('button');
  tb.className = 'tab'; tb.innerHTML = t.title + '<span class="chk"></span>';
  tb.onclick = () => show(ti);
  tabsEl.appendChild(tb); tabBtns.push(tb);

  const pane = document.createElement('div'); pane.className = 'pane';
  pane.innerHTML = `<div class="card task">${t.text}</div><div class="card"><div class="fields"></div>
    <div class="row"><button class="pri">Отправить решение</button><button class="sec">Начать заново</button></div></div>
    <div class="card sol"><div class="score"></div>${t.sol}</div>`;
  const box = pane.querySelector('.fields');
  const inputs = t.fields.map((f, fi) => {
    const id = `t${ti}f${fi}`;
    const w = document.createElement('div');
    w.innerHTML = `<label for="${id}">${f.label}${f.sub ? ' <span class="hint">— ' + f.sub + '</span>' : ''}</label>
      <input id="${id}" autocomplete="off"${f.type === 'n' ? ' inputmode="decimal"' : ''}><div class="fb"></div>`;
    box.appendChild(w);
    return {inp: w.querySelector('input'), fb: w.querySelector('.fb')};
  });
  const sol = pane.querySelector('.sol');
  pane.querySelector('.pri').onclick = () => {
    if (inputs.some(x => !x.inp.value.trim()) && !confirm('Есть незаполненные поля. Отправить решение всё равно?')) return;
    let score = 0;
    t.fields.forEach((f, i) => {
      const ok = f.test(inputs[i].inp.value), {inp, fb} = inputs[i];
      if (ok) score++;
      inp.className = ok ? 'ok' : 'bad';
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.textContent = ok ? '✓ Верно' : '✗ Неверно. ' + f.hint;
    });
    const all = score === t.fields.length;
    sol.querySelector('.score').textContent = `Результат: ${score} из ${t.fields.length}` + (all ? ' — отлично!' : '');
    sol.style.display = 'block';
    tb.querySelector('.chk').textContent = all ? '✓' : `${score}/${t.fields.length}`;
    sol.scrollIntoView({behavior:'smooth', block:'start'});
  };
  pane.querySelector('.sec').onclick = () => {
    inputs.forEach(x => { x.inp.value = ''; x.inp.className = ''; x.fb.textContent = ''; });
    sol.style.display = 'none'; tb.querySelector('.chk').textContent = '';
    window.scrollTo({top:0, behavior:'smooth'});
  };
  panesEl.appendChild(pane); panes.push(pane);
});
show(0);
</script>
</body>
</html>
